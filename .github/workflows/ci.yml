name: Application checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: python -m app.seed
      - run: pytest -q
  deploy-frontend:
    name: Deploy frontend after checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_ENABLED == 'true'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: python .github/scripts/trigger_frontend_deploy.py
